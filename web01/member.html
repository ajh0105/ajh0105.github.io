<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - 청도군 문화관광</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="font2.css">
  <link rel="stylesheet" href="iconset.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">

  <div class="auth-topbar">
    <a href="index.html"><img src="./images/logo.png" alt="청도군 문화관광"></a>
    <div class="auth-topbar__links">
      <a href="index.html">홈으로</a>
      <span class="sep">|</span>
      <a href="log.html">로그인</a>
      <span class="sep">|</span>
      <a href="contact.html">Contact US</a>
    </div>
  </div>

  <div class="auth-wrap">

    <div class="auth-panel auth-panel--signup">
      <span class="auth-panel__bg-text">JOIN US</span>
      <span class="auth-panel__badge">회원 가입 혜택</span>
      <h1>청도 여행의<br>모든 것을<br>함께하세요</h1>
      <p>
        청도군 관광문화 회원이 되면<br>
        더 많은 혜택과 서비스를<br>
        이용할 수 있습니다.
      </p>
      <div class="auth-benefits">
        <div class="auth-benefit">
          <div class="auth-benefit__icon">📸</div>
          나만의 청도 사진 공유 및 공모전 참여
        </div>
        <div class="auth-benefit">
          <div class="auth-benefit__icon">📝</div>
          여행 후기 작성 및 여행 Q&amp;A 이용
        </div>
        <div class="auth-benefit">
          <div class="auth-benefit__icon">🔔</div>
          청도 축제·이벤트 맞춤 알림 수신
        </div>
        <div class="auth-benefit">
          <div class="auth-benefit__icon">🗺️</div>
          모바일 스탬프 투어 참여
        </div>
      </div>
    </div>

    <div class="auth-form-panel">
      <div class="auth-form-box">

        <div class="auth-form-hd">
          <h2>회원가입</h2>
          <p>아래 정보를 입력하여 계정을 만드세요</p>
        </div>

        <div class="auth-steps">
          <div class="auth-step is-active">① 정보 입력</div>
          <div class="auth-step">② 약관 동의</div>
          <div class="auth-step">③ 가입 완료</div>
        </div>

        <form action="#" method="post" onsubmit="return false;">

          <div class="auth-row">
            <div class="auth-fg auth-fg--green">
              <label>이름 <span class="req">*</span></label>
              <input type="text" placeholder="이름" required>
            </div>
            <div class="auth-fg auth-fg--green">
              <label>생년월일</label>
              <input type="date">
            </div>
          </div>

          <div class="auth-fg auth-fg--green">
            <label>이메일 <span class="req">*</span></label>
            <div class="auth-fg__btn-row">
              <input type="email" placeholder="이메일 주소" required>
              <button type="button" class="btn btn--sm btn--green">중복확인</button>
            </div>
          </div>

          <div class="auth-fg auth-fg--green">
            <label>비밀번호 <span class="req">*</span></label>
            <input type="password" placeholder="비밀번호 (8자 이상)" required>
            <p class="auth-fg__hint">영문 대소문자, 숫자, 특수문자 중 2가지 이상 조합 · 8자 이상</p>
          </div>

          <div class="auth-fg auth-fg--green">
            <label>비밀번호 확인 <span class="req">*</span></label>
            <input type="password" placeholder="비밀번호 재입력" required>
          </div>

          <div class="auth-fg auth-fg--green">
            <label>휴대폰 번호</label>
            <div class="auth-fg__btn-row">
              <input type="tel" placeholder="010-0000-0000">
              <button type="button" class="btn btn--sm btn--green">인증요청</button>
            </div>
          </div>

          <div class="auth-row">
            <div class="auth-fg auth-fg--green">
              <label>거주 지역</label>
              <select>
                <option value="">-- 선택 --</option>
                <option>청도군</option>
                <option>대구광역시</option>
                <option>경상북도 기타</option>
                <option>경상남도</option>
                <option>서울/수도권</option>
                <option>기타</option>
              </select>
            </div>
            <div class="auth-fg auth-fg--green">
              <label>성별</label>
              <select>
                <option value="">-- 선택 --</option>
                <option>남성</option>
                <option>여성</option>
                <option>선택 안함</option>
              </select>
            </div>
          </div>

          <div class="agree-box">
            <label class="agree-all">
              <input type="checkbox" id="agreeAll" onchange="toggleAll(this)">
              전체 약관에 동의합니다
            </label>
            <label class="agree-item">
              <input type="checkbox" class="agree-chk" required>
              [필수] 이용약관에 동의합니다
              <a href="#" target="_blank">보기</a>
            </label>
            <label class="agree-item">
              <input type="checkbox" class="agree-chk" required>
              [필수] 개인정보 수집 및 이용에 동의합니다
              <a href="#" target="_blank">보기</a>
            </label>
            <label class="agree-item">
              <input type="checkbox" class="agree-chk">
              [선택] 마케팅 정보 수신에 동의합니다
              <a href="#">보기</a>
            </label>
          </div>

          <button type="submit" class="auth-submit auth-submit--green">회원가입 완료</button>
        </form>

        <p class="auth-link-row">
          이미 계정이 있으신가요? <a href="log.html">로그인</a>
        </p>

      </div>
    </div>

  </div>

  <script>
  function toggleAll(el) {
    document.querySelectorAll('.agree-chk').forEach(function(c) { c.checked = el.checked; });
  }
  </script>
</body>
</html>
