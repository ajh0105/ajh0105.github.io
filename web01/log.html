<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 청도군 문화관광</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="font2.css">
  <link rel="stylesheet" href="iconset.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">

  <div class="auth-topbar">
    <a href="index.html"><img src="./images/logo.png" alt="청도군 문화관광"></a>
    <div class="auth-topbar__links">
      <a href="index.html">홈으로</a>
      <span class="sep">|</span>
      <a href="member.html">회원가입</a>
      <span class="sep">|</span>
      <a href="contact.html">Contact US</a>
    </div>
  </div>

  <div class="auth-wrap">

    <div class="auth-panel auth-panel--login">
      <span class="auth-panel__bg-text">CHEONGDO</span>
      <span class="auth-panel__badge">CHEONGDO CULTURAL TOURISM</span>
      <h1>청도에서의<br>여행을<br>시작하세요</h1>
      <p>
        천년의 역사를 품은 청도.<br>
        로그인하고 나만의 청도 여행을<br>
        계획해보세요.
      </p>
      <div class="auth-chips">
        <span class="auth-chip">🍷 와인터널</span>
        <span class="auth-chip">🚲 레일바이크</span>
        <span class="auth-chip">🏯 운문사</span>
      </div>
    </div>

    <div class="auth-form-panel">
      <div class="auth-form-box">
        <div class="auth-form-hd">
          <h2>로그인</h2>
          <p>청도군 문화관광 계정으로 로그인하세요</p>
        </div>
        <form action="#" method="post" onsubmit="return false;">
          <div class="auth-fg">
            <label>이메일 주소 <span class="req">*</span></label>
            <input type="email" placeholder="이메일을 입력하세요" required>
          </div>
          <div class="auth-fg">
            <label>비밀번호 <span class="req">*</span></label>
            <input type="password" placeholder="비밀번호를 입력하세요" required>
          </div>
          <div class="auth-options">
            <label>
              <input type="checkbox">로그인 상태 유지
            </label>
            <a href="#">비밀번호 찾기</a>
          </div>
          <button type="submit" class="auth-submit">로그인</button>
        </form>
        <div class="auth-divider">또는 소셜 계정으로 로그인</div>
        <div class="auth-sns">
          <button class="auth-sns-btn auth-sns-btn--kakao">
            <span>K</span>카카오
          </button>
          <button class="auth-sns-btn auth-sns-btn--naver">
            <span>N</span>네이버
          </button>
        </div>
        <p class="auth-link-row">
          아직 계정이 없으신가요? <a href="member.html">회원가입</a>
        </p>
      </div>
    </div>

  </div>
</body>
</html>
