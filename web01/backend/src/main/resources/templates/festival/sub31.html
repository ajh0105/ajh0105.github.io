<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('정기축제')}"></head>
<body>
<th:block th:replace="~{fragments/header :: header('festival')}"></th:block>
<div class="page-hero" th:style="'background-image:url(' + @{/images/bigthum01.jpg} + ')'">
  <div class="page-hero__veil"></div>
  <div class="u-container page-hero__inner">
    <nav class="crumb"><a th:href="@{/}">HOME</a> <i class="xi-angle-right-min"></i> 축제/행사 <i class="xi-angle-right-min"></i> 정기축제</nav>
    <h1 class="page-hero__title">정기 축제</h1>
    <p class="page-hero__sub">사계절 청도를 더욱 풍성하게 만드는 축제</p>
  </div>
</div>
<nav class="subnav">
  <div class="u-container subnav__scroll">
    <a class="subnav__item is-active" th:href="@{/festival/regular}">정기축제</a>
    <a class="subnav__item" th:href="@{/festival/event}">이벤트/행사</a>
  </div>
</nav>
<div class="u-container sub-body">
  <main class="sub-main">
    <div class="sub-section">
      <h2 class="sub-section__title sub-section__title--accent">정기 축제</h2>
      <div class="event-grid">
        <div class="event-card"><img class="event-card__img" th:src="@{/images/bigthum01.jpg}" alt="소싸움축제"><div class="event-card__body"><span class="badge badge--event">매년 2~3월</span><h3 class="event-card__title">청도 소싸움 축제</h3><p class="event-card__desc">전통과 힘의 대결! 청도의 봄을 알리는 전통 소싸움 축제입니다.</p></div></div>
        <div class="event-card"><img class="event-card__img" th:src="@{/images/row02.jpg}" alt="와인축제"><div class="event-card__body"><span class="badge badge--event">매년 10월</span><h3 class="event-card__title">청도 와인 축제</h3><p class="event-card__desc">청도 반시로 만든 와인을 즐기는 가을 대표 축제입니다.</p></div></div>
        <div class="event-card"><img class="event-card__img" th:src="@{/images/row03.jpg}" alt="반시감축제"><div class="event-card__body"><span class="badge badge--event">매년 11월</span><h3 class="event-card__title">청도 반시 감 축제</h3><p class="event-card__desc">씨 없는 감 반시의 수확을 기념하는 가을 수확 축제입니다.</p></div></div>
      </div>
    </div>
  </main>
  <aside class="sub-aside">
    <div class="info-card"><div class="info-card__head">축제 문의</div><div class="info-card__list"><div><dt>전화</dt><dd>054-370-6114</dd></div><div><dt>홈페이지</dt><dd>cheongdo.go.kr</dd></div></div></div>
  </aside>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
