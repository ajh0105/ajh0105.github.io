      <h2 class="sub-section__title sub-section__title--accent">청도 역사 연표</h2>
      <div class="timeline">
        <div class="timeline-item"><div class="timeline-year">삼한시대</div><div class="timeline-content"><h4>이서국 건립</h4><p>청도 지역에 이서국이 세워짐.</p></div></div>
