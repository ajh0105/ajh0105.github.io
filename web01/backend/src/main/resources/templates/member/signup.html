<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - 청도군 문화관광</title>
  <link rel="stylesheet" th:href="@{/reset.css}">
  <link rel="stylesheet" th:href="@{/font2.css}">
  <link rel="stylesheet" th:href="@{/iconset.css}">
  <link rel="stylesheet" th:href="@{/tokens.css}">
  <link rel="stylesheet" th:href="@{/base.css}">
  <link rel="stylesheet" th:href="@{/components.css}">
  <link rel="stylesheet" th:href="@{/layout.css}">
  <link rel="stylesheet" th:href="@{/auth.css}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-panel auth-panel--signup">
    <a class="auth-logo" th:href="@{/}">
      <img th:src="@{/images/logo.png}" alt="청도군 문화관광">
    </a>
    <div class="auth-brand">
      <div class="auth-brand__echo">JOIN US</div>
      <h1 class="auth-brand__title">청도 여행의<br>시작을<br>함께하세요</h1>
      <p class="auth-brand__sub">회원가입 후 여행 후기와 소식을<br>자유롭게 나눠보세요.</p>
    </div>
    <div class="auth-benefits">
      <div class="auth-benefit-item"><i class="xi-check-circle"></i><span>여행후기 작성</span></div>
      <div class="auth-benefit-item"><i class="xi-check-circle"></i><span>공지사항 알림</span></div>
      <div class="auth-benefit-item"><i class="xi-check-circle"></i><span>Q&amp;A 문의하기</span></div>
      <div class="auth-benefit-item"><i class="xi-check-circle"></i><span>청도 여행 정보</span></div>
    </div>
  </div>
  <div class="auth-fg">
    <div class="auth-fg__inner">
      <h2 class="auth-fg__title">회원가입</h2>
      <p class="auth-fg__sub">아래 정보를 입력해 주세요</p>

      <div th:if="${errorMsg}" class="auth-alert" style="background:rgba(191,52,52,0.08);border:1px solid var(--c-red);border-radius:var(--r-md);padding:var(--sp-4);margin-bottom:var(--sp-5);color:var(--c-red);font-size:var(--fs-sm);">
        <i class="xi-error-o"></i> <span th:text="${errorMsg}">오류 메시지</span>
      </div>

      <form th:action="@{/signup}" method="post">
        <div class="auth-field">
          <label>이름</label>
          <input type="text" name="name" placeholder="이름을 입력하세요" required>
        </div>
        <div class="auth-field">
          <label>이메일</label>
          <input type="email" name="email" placeholder="이메일을 입력하세요" required autocomplete="email">
        </div>
        <div class="auth-field">
          <label>비밀번호</label>
          <input type="password" name="password" placeholder="비밀번호를 입력하세요 (8자 이상)" required minlength="8">
        </div>
        <div class="auth-field">
          <label>연락처</label>
          <input type="tel" name="phone" placeholder="010-0000-0000">
        </div>
        <button type="submit" class="auth-submit auth-submit--green">가입하기</button>
      </form>

      <div class="auth-footer-links" style="margin-top:var(--sp-5);">
        <span>이미 계정이 있으신가요?</span>
        <a th:href="@{/login}">로그인</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
