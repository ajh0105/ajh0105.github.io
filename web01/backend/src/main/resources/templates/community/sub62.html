<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('자유게시판')}"></head>
<body>
<th:block th:replace="~{fragments/header :: header('community')}"></th:block>
<div class="page-hero" th:style="'background-image:url(' + @{/images/bg_visual-9.jpg} + ')'">
  <div class="page-hero__veil"></div>
  <div class="u-container page-hero__inner">
    <nav class="crumb"><a th:href="@{/}">HOME</a> <i class="xi-angle-right-min"></i> 여행커뮤니티 <i class="xi-angle-right-min"></i> 자유게시판</nav>
    <h1 class="page-hero__title">자유게시판</h1>
    <p class="page-hero__sub">청도 여행 관련 자유롭게 이야기를 나눠보세요</p>
  </div>
</div>
<nav class="subnav">
  <div class="u-container subnav__scroll">
    <a class="subnav__item" th:href="@{/community/notice}">공지사항</a>
    <a class="subnav__item is-active" th:href="@{/community/board}">자유게시판</a>
    <a class="subnav__item" th:href="@{/community/review}">여행후기</a>
    <a class="subnav__item" th:href="@{/community/qna}">여행 Q&amp;A</a>
  </div>
</nav>
<div class="u-container sub-body">
  <main class="sub-main">
    <div class="sub-section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-5);">
        <h2 class="sub-section__title sub-section__title--accent" style="margin:0;">자유게시판</h2>
        <a th:href="@{/community/board/write}" th:if="${session.loginMember != null}" class="btn btn--primary btn--sm">글쓰기</a>
        <a th:href="@{/login}" th:if="${session.loginMember == null}" class="btn btn--line btn--sm">로그인 후 작성</a>
      </div>
      <table class="list-table">
        <thead><tr><th style="width:60px;">번호</th><th>제목</th><th style="width:80px;">작성자</th><th style="width:120px;">등록일</th><th style="width:60px;">조회</th></tr></thead>
        <tbody>
          <tr th:if="${posts.isEmpty()}"><td colspan="5" style="text-align:center;padding:var(--sp-8);">등록된 글이 없습니다.</td></tr>
          <tr th:each="post, stat : ${posts}">
            <td class="td-center" th:text="${posts.totalElements - posts.number * posts.size - stat.index}">1</td>
            <td class="td-title"><a th:href="@{/community/board/{id}(id=${post.id})}" th:text="${post.title}">제목</a></td>
            <td class="td-center" th:text="${post.author?.name ?: '관리자'}">작성자</td>
            <td class="td-date" th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}">날짜</td>
            <td class="td-center" th:text="${post.views}">0</td>
          </tr>
        </tbody>
      </table>
      <div class="pagination" th:if="${posts.totalPages > 1}">
        <a th:href="@{/community/board(page=${posts.number - 1})}" th:if="${posts.hasPrevious()}"><i class="xi-angle-left"></i></a>
        <a th:each="i : ${#numbers.sequence(0, posts.totalPages - 1)}" th:href="@{/community/board(page=${i})}" th:text="${i + 1}" th:classappend="${i == posts.number} ? 'active'">1</a>
        <a th:href="@{/community/board(page=${posts.number + 1})}" th:if="${posts.hasNext()}"><i class="xi-angle-right"></i></a>
      </div>
    </div>
  </main>
  <aside class="sub-aside">
    <div class="info-card"><div class="info-card__head">게시판 안내</div><div class="info-card__list"><div><dt>운영</dt><dd>평일 09:00~18:00</dd></div><div><dt>문의</dt><dd>054-370-6114</dd></div></div></div>
  </aside>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
