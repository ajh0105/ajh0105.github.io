<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${post.title})}"></head>
<body>
<th:block th:replace="~{fragments/header :: header('community')}"></th:block>

<div class="page-hero">
  <div class="page-hero__veil"></div>
  <div class="u-container page-hero__inner">
    <nav class="crumb"><a th:href="@{/}">HOME</a> <span class="crumb__sep">▶</span> 여행커뮤니티</nav>
    <h1 class="page-hero__title" th:text="${post.title}">게시글 제목</h1>
  </div>
</div>

<nav class="subnav">
  <div class="u-container subnav__scroll">
    <a class="subnav__item" th:href="@{/community/notice}">공지사항</a>
    <a class="subnav__item" th:href="@{/community/board}">자유게시판</a>
    <a class="subnav__item" th:href="@{/community/review}">여행후기</a>
    <a class="subnav__item" th:href="@{/community/qna}">여행 Q&amp;A</a>
  </div>
</nav>

<div class="u-container sub-body">
  <main class="sub-main">
    <div class="sub-section">
      <!-- 게시글 헤더 -->
      <div class="view-header" style="border-bottom:2px solid var(--c-primary);padding-bottom:var(--sp-5);margin-bottom:var(--sp-6);">
        <h2 class="sub-section__title" th:text="${post.title}" style="margin-bottom:var(--sp-3);">제목</h2>
        <div style="display:flex;gap:var(--sp-6);font-size:var(--fs-sm);color:var(--c-text-mute);">
          <span>작성자: <strong th:text="${post.author?.name ?: '관리자'}">이름</strong></span>
          <span>등록일: <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')}">날짜</span></span>
          <span>조회: <span th:text="${post.views}">0</span></span>
        </div>
      </div>

      <!-- 게시글 본문 -->
      <div class="view-body prose" style="min-height:200px;padding:var(--sp-6) 0;border-bottom:1px solid var(--c-border);line-height:var(--lh-normal);"
           th:utext="${#strings.replace(#html.escape(post.content), '&#10;', '&lt;br&gt;')}">내용</div>

      <!-- 버튼 영역 -->
      <div style="display:flex;gap:var(--sp-3);margin-top:var(--sp-6);">
        <a th:href="@{/community/{type}(type=${boardType})}" class="btn btn--line">목록으로</a>
        <th:block th:if="${session.loginMember != null and (session.loginMember.id == post.author?.id or session.loginMember.role.name() == 'ADMIN')}">
          <a th:if="${boardType == 'board'}"
             th:href="@{/community/board/edit/{id}(id=${post.id})}"
             class="btn btn--primary btn--sm">수정</a>
          <a th:href="@{/community/{type}/delete/{id}(type=${boardType},id=${post.id})}"
             class="btn btn--sm"
             style="background:var(--c-red);color:#fff;border-color:var(--c-red);"
             onclick="return confirm('삭제하시겠습니까?')">삭제</a>
        </th:block>
      </div>
    </div>
  </main>

  <aside class="sub-aside">
    <div class="info-card">
      <div class="info-card__head">게시판 정보</div>
      <div class="info-card__list">
        <div><dt>조회수</dt><dd th:text="${post.views}">0</dd></div>
        <div><dt>등록일</dt><dd th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}">날짜</dd></div>
      </div>
    </div>
  </aside>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
